name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        # llama-cpp-python is left out: it compiles from source and the tests use fake models
        run: |
          grep -v '^llama-cpp-python' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt pytest
      - name: Run tests
        run: pytest
